name: 发布魔塔网页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 读取源码
        uses: actions/checkout@v4
      - name: 配置Pages
        uses: actions/configure-pages@v5
      - name: 上传静态游戏
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/51
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
